<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iFood $">
<meta name="theme-color" content="#ffffff">
<title>iFood Calculadora</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:env(safe-area-inset-bottom)}
  .header{background:#fff;padding:16px 20px 12px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:10}
  .header h1{font-size:18px;font-weight:600;color:#1a1a1a}
  .header p{font-size:12px;color:#888;margin-top:2px}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
  .metric{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e5e5}
  .metric-label{font-size:11px;color:#888;margin-bottom:4px}
  .metric-value{font-size:20px;font-weight:600}
  .green{color:#16a34a}.red{color:#dc2626}.blue{color:#2563eb}
  .tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;color:#666;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
  .panel{display:none;padding:0 16px 32px}.panel.active{display:block}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:#fff;padding:12px 16px;border-radius:12px;border:1px solid #e5e5e5}
  .cal-nav{display:flex;gap:8px;align-items:center}
  .cal-nav button{background:#f5f5f5;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
  .cal-title{font-size:15px;font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#fff;border-radius:12px;padding:10px;border:1px solid #e5e5e5}
  .cal-day-name{text-align:center;font-size:10px;color:#aaa;padding:4px 0;font-weight:500}
  .cal-day{border-radius:8px;padding:4px 2px;min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.1s}
  .cal-day:active{background:#f0f0f0}
  .cal-day.empty{cursor:default}
  .cal-day.today{background:#eff6ff}
  .cal-day.has-data{background:#f9fafb}
  .cal-day.selected{background:#f0fdf4;outline:2px solid #16a34a}
  .day-num{font-size:11px;font-weight:600;color:#666;text-align:center}
  .day-dot{width:5px;height:5px;border-radius:50%;margin:2px auto 0}
  .day-mini{font-size:9px;text-align:center;margin-top:1px;font-weight:500}
  .entry-form{background:#fff;border-radius:12px;padding:16px;margin-top:12px;border:1px solid #e5e5e5}
  .entry-title{font-size:15px;font-weight:600;margin-bottom:14px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .form-group{display:flex;flex-direction:column;gap:4px}
  .form-group label{font-size:11px;color:#888;font-weight:500}
  .form-group input{padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#f9f9f9;color:#1a1a1a;font-size:15px;width:100%;-webkit-appearance:none}
  .form-group input:focus{outline:none;border-color:#16a34a;background:#fff}
  .btn-save{width:100%;padding:12px;border-radius:10px;border:none;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent}
  .btn-save:active{opacity:0.85}
  .btn-delete{font-size:13px;color:#dc2626;background:transparent;border:none;cursor:pointer;margin-top:10px;display:block;text-align:center;width:100%;padding:4px}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f0}
  .list-item:last-child{border-bottom:none}
  .list-date{font-size:13px;color:#888}
  .empty-msg{text-align:center;color:#aaa;font-size:14px;padding:3rem 0}
  .section-title{font-size:11px;font-weight:600;color:#aaa;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e5e5e5}
  .moto-badge{display:inline-flex;align-items:center;gap:6px;background:#f5f5f5;border-radius:20px;padding:6px 12px;font-size:12px;color:#666;margin-bottom:14px;font-weight:500}
  .gas-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;background:#f9f9f9;border-radius:10px;border:1px solid #eee}
  .gas-label{font-size:12px;color:#888;white-space:nowrap}
  .gas-input{padding:6px 8px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-size:14px;width:80px;-webkit-appearance:none;text-align:center}
  .gas-input:focus{outline:none;border-color:#16a34a}
  .big-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .big-input-group{display:flex;flex-direction:column;gap:4px}
  .big-input-group label{font-size:11px;color:#888;font-weight:500}
  .big-input-group input{padding:14px 10px;border-radius:10px;border:1px solid #ddd;background:#f9f9f9;color:#1a1a1a;font-size:24px;font-weight:700;width:100%;text-align:center;-webkit-appearance:none}
  .big-input-group input:focus{outline:none;border-color:#16a34a;background:#fff}
  .resultado-box{border-radius:12px;padding:16px;margin-top:4px;border:1px solid #e5e5e5}
  .resultado-box.vale{background:#f0fdf4;border-color:#bbf7d0}
  .resultado-box.nao-vale{background:#fef2f2;border-color:#fecaca}
  .resultado-linha{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.06)}
  .resultado-linha:last-child{border-bottom:none;font-weight:700;font-size:15px;padding-top:10px}
  .veredicto{font-size:24px;font-weight:700;margin-bottom:4px}
  .veredicto.sim{color:#16a34a}.veredicto.nao{color:#dc2626}
  .valor-minimo{font-size:12px;color:#888;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)}
  .list-values{display:flex;gap:8px;font-size:13px;align-items:center}
</style>
</head>
<body>

<div class="header">
  <h1>iFood Calculadora</h1>
  <p>CG 125 · 1997 · 35 km/litro</p>
</div>

<div style="padding:16px 0 0">
  <div class="summary-grid">
    <div class="metric"><div class="metric-label">Total ganho</div><div class="metric-value green" id="total-ganho">R$ 0,00</div></div>
    <div class="metric"><div class="metric-label">Total gasolina</div><div class="metric-value red" id="total-gasto">R$ 0,00</div></div>
    <div class="metric"><div class="metric-label">Líquido</div><div class="metric-value blue" id="total-liquido">R$ 0,00</div></div>
    <div class="metric"><div class="metric-label">Dias trabalhados</div><div class="metric-value" id="total-dias">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calendario')">📅 Calendário</button>
    <button class="tab" onclick="switchTab('ganhos')">📈 Ganhos</button>
    <button class="tab" onclick="switchTab('gasolina')">⛽ Gasolina</button>
    <button class="tab" onclick="switchTab('rota')">🛵 Vale a pena?</button>
  </div>
</div>

<div class="panel active" id="panel-calendario">
  <div class="cal-header">
    <button class="cal-nav" onclick="navMonth(-1)" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px">‹</button>
    <span class="cal-title" id="cal-title"></span>
    <button class="cal-nav" onclick="navMonth(1)" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="entry-form" id="entry-form" style="display:none">
    <div class="entry-title" id="entry-title">Registrar dia</div>
    <div class="form-row">
      <div class="form-group"><label>Ganho iFood (R$)</label><input type="number" id="inp-ganho" placeholder="0,00" step="0.01" min="0" inputmode="decimal"></div>
      <div class="form-group"><label>Gasto gasolina (R$)</label><input type="number" id="inp-gasto" placeholder="0,00" step="0.01" min="0" inputmode="decimal"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Km rodados</label><input type="number" id="inp-km" placeholder="0" step="1" min="0" inputmode="numeric"></div>
      <div class="form-group"><label>Horas trabalhadas</label><input type="number" id="inp-horas" placeholder="0" step="0.5" min="0" inputmode="decimal"></div>
    </div>
    <button class="btn-save" onclick="salvarDia()">✓ Salvar</button>
    <button class="btn-delete" id="btn-delete" onclick="deletarDia()" style="display:none">🗑 Remover registro</button>
  </div>
</div>

<div class="panel" id="panel-ganhos">
  <p class="section-title">Detalhamento — ganhos</p>
  <div class="card" id="lista-ganhos"></div>
</div>

<div class="panel" id="panel-gasolina">
  <p class="section-title">Detalhamento — gasolina</p>
  <div class="card" id="lista-gasolina"></div>
</div>

<div class="panel" id="panel-rota">
  <p class="section-title">Vale a pena aceitar?</p>
  <div class="card">
    <div class="moto-badge">🏍 Honda CG 125 · 1997 · 35 km/litro</div>
    <div class="gas-row">
      <span class="gas-label">⛽ Gasolina (R$/L):</span>
      <input class="gas-input" type="number" id="r-preco-gas" placeholder="6,20" step="0.01" min="0" inputmode="decimal" oninput="calcRota()">
    </div>
    <div class="big-inputs">
      <div class="big-input-group">
        <label>📍 Distância (km)</label>
        <input type="number" id="r-km" placeholder="0" step="0.1" min="0" inputmode="decimal" oninput="calcRota()">
      </div>
      <div class="big-input-group">
        <label>💰 Valor (R$)</label>
        <input type="number" id="r-valor" placeholder="0" step="0.01" min="0" inputmode="decimal" oninput="calcRota()">
      </div>
    </div>
    <div id="resultado-rota"></div>
  </div>
</div>

<script>
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS=['D','S','T','Q','Q','S','S'];
const CONSUMO=35;
let now=new Date(),viewYear=now.getFullYear(),viewMonth=now.getMonth(),selKey=null,data={};
try{data=JSON.parse(localStorage.getItem('ifood_v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('ifood_v1',JSON.stringify(data))}catch(e){}}
function dKey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function fmt(v){return'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function calcTotals(){
  let g=0,gs=0,dias=0;
  Object.values(data).forEach(d=>{if(d.ganho||d.gasto)dias++;g+=Number(d.ganho||0);gs+=Number(d.gasto||0)});
  document.getElementById('total-ganho').textContent=fmt(g);
  document.getElementById('total-gasto').textContent=fmt(gs);
  const liq=g-gs;
  const el=document.getElementById('total-liquido');
  el.textContent=fmt(liq);
  el.className='metric-value '+(liq>=0?'blue':'red');
  document.getElementById('total-dias').textContent=dias;
}

function renderCal(){
  document.getElementById('cal-title').textContent=MONTHS[viewMonth]+' '+viewYear;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML=DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  const first=new Date(viewYear,viewMonth,1).getDay();
  const days=new Date(viewYear,viewMonth+1,0).getDate();
  for(let i=0;i<first;i++)grid.innerHTML+='<div class="cal-day empty"></div>';
  const todayKey=dKey(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=days;d++){
    const key=dKey(viewYear,viewMonth,d);
    const rec=data[key];
    const hasData=rec&&(rec.ganho||rec.gasto);
    const liq=hasData?(Number(rec.ganho||0)-Number(rec.gasto||0)):0;
    grid.innerHTML+=`<div class="cal-day${key===todayKey?' today':''}${hasData?' has-data':''}${key===selKey?' selected':''}" onclick="selectDay(${viewYear},${viewMonth},${d})">
      <div class="day-num">${d}</div>
      ${hasData?`<div class="day-dot" style="background:${liq>=0?'#16a34a':'#dc2626'}"></div>`:''}
      ${hasData?`<div class="day-mini" style="color:${liq>=0?'#16a34a':'#dc2626'}">${liq>=0?'+':''}${liq.toLocaleString('pt-BR',{maximumFractionDigits:0})}</div>`:''}
    </div>`;
  }
}

function selectDay(y,m,d){
  selKey=dKey(y,m,d);renderCal();
  const form=document.getElementById('entry-form');
  form.style.display='block';
  const rec=data[selKey]||{};
  document.getElementById('entry-title').textContent=`${d} de ${MONTHS[m]}`;
  document.getElementById('inp-ganho').value=rec.ganho||'';
  document.getElementById('inp-gasto').value=rec.gasto||'';
  document.getElementById('inp-km').value=rec.km||'';
  document.getElementById('inp-horas').value=rec.horas||'';
  document.getElementById('btn-delete').style.display=(rec.ganho||rec.gasto)?'block':'none';
  setTimeout(()=>form.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function salvarDia(){
  if(!selKey)return;
  const g=parseFloat(document.getElementById('inp-ganho').value)||0;
  const gs=parseFloat(document.getElementById('inp-gasto').value)||0;
  const km=parseFloat(document.getElementById('inp-km').value)||0;
  const h=parseFloat(document.getElementById('inp-horas').value)||0;
  if(g||gs||km||h){data[selKey]={ganho:g,gasto:gs,km,horas:h}}else{delete data[selKey]}
  save();calcTotals();renderCal();renderListas();
  document.getElementById('btn-delete').style.display=(g||gs)?'block':'none';
}

function deletarDia(){
  if(!selKey)return;
  delete data[selKey];save();calcTotals();renderCal();renderListas();
  document.getElementById('entry-form').style.display='none';selKey=null;
}

function navMonth(dir){
  viewMonth+=dir;
  if(viewMonth>11){viewMonth=0;viewYear++}
  if(viewMonth<0){viewMonth=11;viewYear--}
  renderCal();
}

function renderListas(){
  const keys=Object.keys(data).sort().reverse();
  const lg=document.getElementById('lista-ganhos');
  const lgs=document.getElementById('lista-gasolina');
  if(!keys.length){
    lg.innerHTML='<div class="empty-msg">Nenhum registro ainda</div>';
    lgs.innerHTML='<div class="empty-msg">Nenhum registro ainda</div>';
    return;
  }
  lg.innerHTML=keys.map(k=>{
    const r=data[k];const[y,m,d]=k.split('-');
    const liq=(Number(r.ganho||0)-Number(r.gasto||0));
    return`<div class="list-item">
      <span class="list-date">${d}/${m}/${y}</span>
      <div class="list-values">
        <span style="color:#16a34a">+${fmt(r.ganho)}</span>
        <span style="color:${liq>=0?'#2563eb':'#dc2626'};font-weight:600">${liq>=0?'':'-'}${fmt(Math.abs(liq))}</span>
        ${r.horas?`<span style="color:#aaa;font-size:12px">${r.horas}h</span>`:''}
      </div>
    </div>`;
  }).join('');
  lgs.innerHTML=keys.map(k=>{
    const r=data[k];const[y,m,d]=k.split('-');
    return`<div class="list-item">
      <span class="list-date">${d}/${m}/${y}</span>
      <div class="list-values">
        <span style="color:#dc2626">-${fmt(r.gasto)}</span>
        ${r.km?`<span style="color:#aaa;font-size:12px">${r.km} km</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function calcRota(){
  const km=parseFloat(document.getElementById('r-km').value)||0;
  const valor=parseFloat(document.getElementById('r-valor').value)||0;
  const precoGas=parseFloat(document.getElementById('r-preco-gas').value)||0;
  const box=document.getElementById('resultado-rota');
  if(!km||!valor||!precoGas){box.innerHTML='';return}
  const custoGas=(km/CONSUMO)*precoGas;
  const liquido=valor-custoGas;
  const pctGas=valor>0?((custoGas/valor)*100):0;
  const litros=km/CONSUMO;
  const vale=liquido>0;
  box.innerHTML=`<div class="resultado-box ${vale?'vale':'nao-vale'}">
    <div class="veredicto ${vale?'sim':'nao'}">${liquido<=0?'Prejuízo!':liquido<2?'Quase no zero':'Vale a pena! ✓'}</div>
    <div style="font-size:13px;color:#666;margin-bottom:12px">${vale?'Cobre o combustível e sobra lucro.':'O valor não cobre nem a gasolina.'}</div>
    <div class="resultado-linha"><span>Valor da entrega</span><span style="color:#16a34a">${fmt(valor)}</span></div>
    <div class="resultado-linha"><span>Distância</span><span>${km.toFixed(1)} km</span></div>
    <div class="resultado-linha"><span>Litros gastos</span><span>${litros.toFixed(2)} L</span></div>
    <div class="resultado-linha"><span>Custo gasolina</span><span style="color:#dc2626">-${fmt(custoGas)}</span></div>
    <div class="resultado-linha"><span>Gasolina leva</span><span>${pctGas.toFixed(1)}% do valor</span></div>
    <div class="resultado-linha"><span>Líquido no bolso</span><span style="color:${liquido>=0?'#16a34a':'#dc2626'}">${fmt(liquido)}</span></div>
    <div class="valor-minimo">Valor mínimo justo para ${km.toFixed(1)} km: <strong>${fmt(custoGas)}</strong></div>
  </div>`;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const tabs=['calendario','ganhos','gasolina','rota'];
  document.querySelectorAll('.tab')[tabs.indexOf(name)].classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

calcTotals();renderCal();renderListas();
</script>
</body>
</html>
